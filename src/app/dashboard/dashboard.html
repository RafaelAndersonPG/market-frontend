<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Puestos</h2>

    <button class="btn btn-success" (click)="createPuesto()">
      + Nuevo puesto
    </button>
  </div>

  @let puestos = puestos$ | async;

  @if (!puestos) {
  <div class="text-center">
    <div class="spinner-border"></div>
  </div>
  }

  @else {

  @if (puestos.length === 0) {
  <div class="alert alert-info">
    No hay puestos
  </div>
  }

  @else {

  <div class="list-group shadow-sm">

    @for (p of puestos; track p.id) {

    <div class="list-group-item d-flex justify-content-between align-items-center">

      <div (click)="seleccionarPuesto(p)" style="cursor:pointer">
        <strong>Puesto {{ p.name }}</strong>
        <div class="text-muted small">
          Dueño: {{ p.ownerName }}
        </div>
      </div>

      <div class="btn-group">

        <button class="btn btn-sm btn-primary" (click)="editPuesto(p)">
          Editar
        </button>

        <button class="btn btn-sm btn-danger mx-2" (click)="deletePuesto(p)">
          Eliminar
        </button>

      </div>

    </div>

    }

  </div>
  }
  }
</div>
